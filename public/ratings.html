<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player Ratings</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#14213d;font-family:Arial,sans-serif}.wrap{max-width:680px;margin:auto;padding:18px}.card{background:white;border-radius:16px;padding:18px;box-shadow:0 5px 20px #0001;margin-bottom:14px}h1{font-size:26px;margin:0 0 6px}.muted{color:#667085}.me{display:flex;align-items:center;gap:14px}.avatar{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#dbe3ef}.player{display:grid;grid-template-columns:52px 1fr 86px;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #e7ebf0}.player img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#dbe3ef}.score,select{width:100%;padding:12px;border:1px solid #bbc5d3;border-radius:10px;font-size:16px}.score{width:82px;padding:10px}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#082b67;color:white;font-weight:700;font-size:16px;margin-top:10px}.secondary{background:#e8eef8;color:#082b67}.error{background:#fee4e2;color:#b42318;padding:12px;border-radius:10px}.success{text-align:center;padding:36px 10px}.photoInput{margin-top:10px;width:100%}.done{color:#087443}@media(max-width:420px){.wrap{padding:10px}.card{padding:14px}.player{grid-template-columns:46px 1fr 76px}.player img{width:46px;height:46px}.score{width:72px}}
</style></head><body><main class="wrap" id="app"><div class="card">Loading…</div></main><script>
const app=document.getElementById('app');let token=localStorage.getItem('playerRatingsToken')||'',data,ratings={};const blank='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#dbe3ef"/><circle cx="50" cy="36" r="20" fill="#8492a6"/><path d="M15 100c4-28 20-40 35-40s31 12 35 40" fill="#8492a6"/></svg>');
function displayName(p){return `${p.firstName} ${p.lastName}${p.isGoalie?' (Goalie)':''}`}
async function api(url,opt){const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
async function start(){if(token){try{return await loadSession()}catch(e){localStorage.removeItem('playerRatingsToken');token=''}}try{const d=await api('/api/ratings/open');renderSelect(d)}catch(e){app.innerHTML='<div class="card error">'+e.message+'</div>'}}
function renderSelect(d){app.innerHTML=`<div class="card"><h1>${d.session.title}</h1><p class="muted">Select your name to begin. You will rate every other player from 1.0 to 10.0.</p><label><strong>Your name</strong></label><select id="player"><option value="">Select your name</option>${d.players.map(p=>`<option value="${p.id}" ${p.submitted?'disabled':''}>${displayName(p)}${p.submitted?' — completed':''}</option>`).join('')}</select><button class="btn" id="continue">Continue</button><div id="msg"></div></div>`;document.getElementById('continue').onclick=selectPlayer}
async function selectPlayer(){const id=Number(document.getElementById('player').value),msg=document.getElementById('msg');if(!id){msg.innerHTML='<p class="error">Select your name.</p>';return}try{const d=await api('/api/ratings/select-player',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({participantId:id})});token=d.token;localStorage.setItem('playerRatingsToken',token);await loadSession()}catch(e){msg.innerHTML='<p class="error">'+e.message+'</p>'}}
async function loadSession(){data=await api('/api/ratings/session/'+token);ratings={...data.ratings};render()}
function render(){if(data.me.submitted){localStorage.removeItem('playerRatingsToken');app.innerHTML='<div class="card success"><h1>Thank you</h1><p>Your ratings have been submitted.</p><button class="btn secondary" onclick="location.reload()">Return to Name List</button></div>';return}const others=data.players.filter(p=>p.id!==data.me.id);app.innerHTML=`<div class="card"><h1>${data.session.title}</h1><p class="muted">Rate every other player from 1.0 to 10.0. Your individual ratings are confidential.</p></div><div class="card me"><img class="avatar" id="myPhoto" src="${data.me.photo||blank}"><div><strong>${displayName(data.me)}</strong><div class="muted">Upload your headshot</div><input class="photoInput" id="photo" type="file" accept="image/*" capture="user"></div></div><div class="card"><h2>Players</h2>${others.map(p=>`<div class="player"><img src="${p.photo||blank}"><div><strong>${displayName(p)}</strong></div><input class="score" data-id="${p.id}" type="number" min="1" max="10" step="0.1" placeholder="1–10" value="${ratings[p.id]??''}"></div>`).join('')}<button class="btn secondary" id="save">Save Progress</button><button class="btn" id="submit">Submit Ratings</button><button class="btn secondary" id="switch">Choose Different Name</button><div id="msg"></div></div>`;document.querySelectorAll('.score').forEach(x=>x.oninput=()=>ratings[x.dataset.id]=x.value);document.getElementById('save').onclick=()=>save(false);document.getElementById('submit').onclick=()=>save(true);document.getElementById('photo').onchange=uploadPhoto;document.getElementById('switch').onclick=()=>{localStorage.removeItem('playerRatingsToken');token='';start()}}
async function uploadPhoto(e){const f=e.target.files[0];if(!f)return;const img=new Image(),reader=new FileReader();reader.onload=()=>img.src=reader.result;img.onload=async()=>{const size=320,c=document.createElement('canvas');c.width=c.height=size;const ctx=c.getContext('2d'),scale=Math.max(size/img.width,size/img.height),w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);const photo=c.toDataURL('image/jpeg',.78);try{await api('/api/ratings/session/'+token+'/photo',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({photo})});data.me.photo=photo;document.getElementById('myPhoto').src=photo}catch(err){alert(err.message)}};reader.readAsDataURL(f)}
async function save(submit){const list=Object.entries(ratings).map(([playerId,rating])=>({playerId:Number(playerId),rating:Number(rating)}));const msg=document.getElementById('msg');try{await api('/api/ratings/session/'+token+'/'+(submit?'submit':'save'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ratings:list})});if(submit){data.me.submitted=true;render()}else msg.innerHTML='<p class="done">Progress saved.</p>'}catch(e){msg.innerHTML='<p class="error">'+e.message+'</p>'}}
start();
</script></body></html>
