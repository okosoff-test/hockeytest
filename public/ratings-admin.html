<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player Ratings Admin</title><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#eef2f7;color:#14213d}.wrap{max-width:1050px;margin:auto;padding:20px}.card{background:#fff;padding:18px;border-radius:14px;margin-bottom:15px;box-shadow:0 4px 18px #0001}button{padding:10px 14px;border:0;border-radius:8px;background:#082b67;color:#fff;font-weight:700;cursor:pointer}.danger{background:#b42318}.open{color:#087443;font-weight:bold}.closed{color:#b42318;font-weight:bold}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5e7eb}.photo{width:42px;height:42px;object-fit:cover;border-radius:8px;background:#ddd}.link{max-width:310px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:750px){.grid{grid-template-columns:1fr}.wrap{padding:10px}table{font-size:13px}}</style></head><body><main class="wrap"><h1>Player Ratings</h1><div id="app" class="card">Loading…</div></main><script>
function displayName(p){return `${p.firstName} ${p.lastName}${p.isGoalie?' (Goalie)':''}`}const KEY='hockey_admin_session';let token=localStorage.getItem(KEY)||sessionStorage.getItem(KEY)||'';const app=document.getElementById('app');async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-admin-auth':token};const r=await fetch(url,opt),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}async function load(){try{const d=await api('/api/admin/ratings');render(d)}catch(e){app.innerHTML='<p>'+e.message+'</p><p>Log into the main admin panel first, then reopen this page.</p>'}}function render(d){if(!d.active){app.innerHTML=`<h2>Create temporary ratings session</h2><p>This imports the current player list and includes Hao, Craig, Mat, and Lilly as goalies. The list will stay fixed even if the weekly roster changes.</p><button onclick="createSession()">Create and Open Ratings</button>`;return}const base=location.origin+'/ratings';app.innerHTML=`<div class="card"><h2>${d.active.title}</h2><p>Status: <span class="${d.active.is_open?'open':'closed'}">${d.active.is_open?'OPEN':'CLOSED'}</span></p><button onclick="toggle(${!d.active.is_open})">${d.active.is_open?'Close Ratings Page':'Reopen Ratings Page'}</button></div><div class="grid"><div class="card"><h2>Shared Player Link</h2><p>Send this same link to every player:</p><p class="link"><a href="${base}" target="_blank">${base}</a></p><button onclick="copy('${base}')">Copy Shared Link</button><h2 style="margin-top:24px">Completion</h2><table><tr><th>Player</th><th>Status</th><th></th></tr>${d.participants.map(p=>`<tr><td>${displayName(p)}</td><td>${p.submitted?'Submitted':'Pending'}</td><td>${p.submitted?`<button class="danger" onclick="resetPlayer(${p.id})">Reset</button>`:''}</td></tr>`).join('')}</table></div><div class="card"><h2>Results</h2><table><tr><th>Player</th><th>Average</th><th>Ratings</th></tr>${d.results.map(r=>`<tr><td>${displayName(r)}</td><td>${r.average??'—'}</td><td>${r.count}</td></tr>`).join('')}</table></div></div>`}async function createSession(){try{await api('/api/admin/ratings/create',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title:'Player Ratings'})});load()}catch(e){alert(e.message)}}async function toggle(isOpen){try{const d=await api('/api/admin/ratings');await api('/api/admin/ratings/toggle',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sessionId:d.active.id,isOpen})});load()}catch(e){alert(e.message)}}async function resetPlayer(id){if(!confirm('Clear this player’s submitted ratings so they can submit again?'))return;await api('/api/admin/ratings/reset-player',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({participantId:id})});load()}function copy(v){navigator.clipboard.writeText(v);alert('Link copied.')}load();
</script></body></html>
